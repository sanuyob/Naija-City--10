name: Naija City gameplay verification

on:
  push:
    branches:
      - feature/naija-city-drive-stage-01
      - feature/naija-city-stage-05-rpg-foundation
      - feature/naija-city-stage-06-third-person
      - feature/naija-city-stage-07-landscape-hud
      - feature/naija-city-stage-08b-nigerian-building-detail
      - feature/naija-city-stage-08c-street-infrastructure
      - feature/naija-city-stage-08d-semi-photoreal-buildings
      - feature/naija-city-stage-08e-handcrafted-buildings
      - feature/naija-city-stage-08f-final-artistry
  pull_request:
    branches:
      - main
      - feature/naija-city-stage-08d-semi-photoreal-buildings
      - feature/naija-city-stage-08e-handcrafted-buildings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Stage 08F PBR source and artifact cache
        uses: actions/cache@v4
        with:
          path: .cache/stage-08f
          key: stage-08f-pbr-v1-${{ runner.os }}-node22-${{ hashFiles('scripts/generate-stage-08f-hero.mjs') }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run source and project checks
        run: npm run verify
      - name: Build production bundle
        run: npm run build
      - name: Enforce production JavaScript budgets
        run: npm run analyze:bundle
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke test
        run: npm run test:browser
