name: Naija City playable preview

on:
  push:
    branches:
      - feature/naija-city-drive-stage-01
      - feature/naija-city-stage-05-rpg-foundation
      - feature/naija-city-stage-06-third-person
      - feature/naija-city-stage-07-landscape-hud
      - feature/naija-city-stage-08b-nigerian-building-detail
      - feature/naija-city-stage-08c-street-infrastructure
      - feature/naija-city-stage-08d-semi-photoreal-buildings
      - feature/naija-city-stage-08e-handcrafted-buildings
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 06
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify gameplay, build and mobile browser smoke test
        run: |
          npm run verify
          npm run build
          npm run analyze:bundle
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run landscape mobile browser smoke test
        run: npm run test:browser
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playable preview
        id: deployment
        uses: actions/deploy-pages@v4
