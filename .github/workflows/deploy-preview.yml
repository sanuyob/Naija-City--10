name: Naija City playable preview

on:
  push:
    branches:
      - feature/naija-city-drive-stage-01
      - feature/naija-city-stage-05-rpg-foundation
      - feature/naija-city-stage-06-third-person
      - feature/naija-city-stage-07-landscape-hud
      - feature/naija-city-stage-08a-city-expansion
      - feature/naija-city-stage-08b-nigerian-building-detail
      - feature/naija-city-stage-08c-street-infrastructure
      - feature/naija-city-stage-08d-semi-photoreal-buildings
      - feature/naija-city-stage-08e-handcrafted-buildings
      - feature/naija-city-stage-08f-final-artistry
      - feature/naija-city-stage-08g-ikeja-street-life
      - feature/naija-city-stage-08h-ikeja-prop-realism
      - feature/hero01-18clips-player-integration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 06
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Khronos KTX-Software 4.4.2
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/KTX-Software-4.4.2-Linux-x86_64.tar.bz2"
          install_dir="${RUNNER_TEMP}/ktx-software"
          curl --fail --location --silent --show-error "https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2" --output "$archive"
          echo "a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xjf "$archive" -C "$install_dir"
          ktx_bin="$(find "$install_dir" -type f -name ktx -perm -u+x -print -quit)"
          test -n "$ktx_bin"
          echo "$(dirname "$ktx_bin")" >> "$GITHUB_PATH"
          ktx_lib="$(find "$install_dir" -type d -name lib -print -quit)"
          if [ -n "$ktx_lib" ]; then
            echo "LD_LIBRARY_PATH=$ktx_lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi
          "$ktx_bin" --version
      - name: Verify gameplay, build and mobile browser smoke test
        run: |
          npm run verify
          npm run build
          npm run analyze:bundle
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run landscape mobile browser smoke test
        run: npm run test:browser
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playable preview
        id: deployment
        uses: actions/deploy-pages@v4
