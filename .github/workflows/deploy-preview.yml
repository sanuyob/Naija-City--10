name: Stage 05 rendering and asset pipeline preview

on:
  push:
    branches:
      - feature/naija-city-drive-stage-01
      - fix/stage-05-rendering-asset-pipeline
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 04
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Stage 05 rendering, assets and build
        run: |
          npm run verify
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run build
          npm run analyze:bundle
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/fix/stage-05-rendering-asset-pipeline'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playable preview
        id: deployment
        uses: actions/deploy-pages@v4
