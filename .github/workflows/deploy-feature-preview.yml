name: Naija City feature branch playable preview

on:
  push:
    branches:
      - feature/stage-08m-nigerian-street-tech

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested feature release
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Khronos KTX-Software 4.4.2
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/KTX-Software-4.4.2-Linux-x86_64.tar.bz2"
          install_dir="${RUNNER_TEMP}/ktx-software"
          curl --fail --location --silent --show-error "https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2" --output "$archive"
          echo "a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xjf "$archive" -C "$install_dir"
          ktx_bin="$(find "$install_dir" -type f -name ktx -perm -u+x -print -quit)"
          test -n "$ktx_bin"
          echo "$(dirname "$ktx_bin")" >> "$GITHUB_PATH"
          ktx_lib="$(find "$install_dir" -type d -name lib -print -quit)"
          if [ -n "$ktx_lib" ]; then
            echo "LD_LIBRARY_PATH=$ktx_lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi
          "$ktx_bin" --version
      - name: Build the playable game with GitHub Pages base path
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify production build, all NPC assets, vehicle fleets and browser runtime
        run: npm run test:production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested Naija City preview
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed release source and asset manifest
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install WebGL-enabled Chromium for live-site verification
        run: npx playwright install --with-deps chromium
      - name: Verify the actual published GitHub Pages game
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:production
